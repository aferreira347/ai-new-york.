}

.font-bold{
  font-weight: 700;
}

.font-normal{
  font-weight: 400;
}

.leading-\[0\.95\]{
  line-height: 0.95;
}

.leading-\[0\.9\]{
  line-height: 0.9;
}

.leading-none{
  line-height: 1;
}

.leading-relaxed{
  line-height: 1.625;
}

.leading-snug{
  line-height: 1.375;
}

.leading-tight{
  line-height: 1.25;
}

.tracking-\[0\.18em\]{
  letter-spacing: 0.18em;
}

.tracking-widest{
  letter-spacing: 0.1em;
}

.text-\[\#888\]{
  --tw-text-opacity: 1;
  color: rgb(136 136 136 / var(--tw-text-opacity, 1));
}

.text-\[\#999\]{
  --tw-text-opacity: 1;
  color: rgb(153 153 153 / var(--tw-text-opacity, 1));
}

.text-\[\#FF2D95\]{
  --tw-text-opacity: 1;
  color: rgb(255 45 149 / var(--tw-text-opacity, 1));
}

.text-\[\#FFE600\]{
  --tw-text-opacity: 1;
  color: rgb(255 230 0 / var(--tw-text-opacity, 1));
}

.text-\[\#aaa\]{
  --tw-text-opacity: 1;
  color: rgb(170 170 170 / var(--tw-text-opacity, 1));
}

.text-\[\#bbb\]{
  --tw-text-opacity: 1;
  color: rgb(187 187 187 / var(--tw-text-opacity, 1));
}

.text-\[\#ccc\]{
  --tw-text-opacity: 1;
  color: rgb(204 204 204 / var(--tw-text-opacity, 1));
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.text-white\/85{
  color: rgb(255 255 255 / 0.85);
}

.text-white\/90{
  color: rgb(255 255 255 / 0.9);
}

.underline{
  text-decoration-line: underline;
}

.accent-\[\#FFE600\]{
  accent-color: #FFE600;
}

.shadow-2xl{
  --tw-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --tw-shadow-colored: 0 25px 50px -12px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --surface:#0a0a0a;
  --surface-2:#141414;
  --surface-3:#1c1c1c;
  --ink:#ffffff;
  --muted:#b8b8b8;
  --line:#2b2b2b;
  --yellow:#FFE600;
  --pink:#FF2D95;
  --blue:#3A86FF;
  --teal:#00C2A8;
  --paper:#ffffff;
  --ink-on-paper:#000000;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#070707;
    --surface-2:#121212;
    --surface-3:#1a1a1a;
    --ink:#ffffff;
    --muted:#c2c2c2;
    --line:#2b2b2b;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--surface);
  color:var(--ink)
}

body{
  font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif
}

.font-display{
  font-family:"Archivo Black","Space Grotesk",system-ui,sans-serif;
  letter-spacing:-.02em
}

input,textarea,select{
  color:#000;
  background:#fff
}

input::-moz-placeholder{
  color:#666
}

input::placeholder{
  color:#666
}

img{
  display:block
}

button{
  cursor:pointer
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.hover\:border-\[\#FFE600\]:hover{
  --tw-border-opacity: 1;
  border-color: rgb(255 230 0 / var(--tw-border-opacity, 1));
}

@media (min-width: 640px){
  .sm\:m-4{
    margin: 1rem;
  }

  .sm\:mx-4{
    margin-left: 1rem;
    margin-right: 1rem;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:h-\[170px\]{
    height: 170px;
  }

  .sm\:h-\[480px\]{
    height: 480px;
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:text-\[12px\]{
    font-size: 12px;
  }

  .sm\:text-\[13px\]{
    font-size: 13px;
  }

  .sm\:text-\[56px\]{
    font-size: 56px;
  }
}

@media (min-width: 768px){
  .md\:inline{
    display: inline;
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-5{
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[70\%_30\%\]{
    grid-template-columns: 70% 30%;
  }
}
